<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0b1020" />

  <title>Service | Fairfax Dentist</title>
  <meta name="description" content="Service details — Fairfax Dentist." />

  <style>
    :root{
      --bg:#070a14;
      --bg2:#0b1020;
      --panel: rgba(255,255,255,.05);
      --ink: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.68);

      --accent: #7aa2ff;
      --accent2:#7de3ff;

      --max: 1050px;
      --pad: max(22px, 5vw);
      --radius: 18px;

      --h1: clamp(28px, 4.4vw, 44px);
      --h2: clamp(18px, 2.8vw, 26px);
      --p:  clamp(15px, 1.1vw, 18px);
    }

    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth; height:100%}
    body{
      margin:0; min-height:100%;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 12% 0%, rgba(122,162,255,.12), transparent 60%),
        radial-gradient(900px 500px at 86% 14%, rgba(125,227,255,.10), transparent 60%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      line-height:1.65;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }
    a{color:inherit; text-decoration:none}
    img{max-width:100%; height:auto; display:block}

    .wrap{
      max-width: var(--max);
      margin: 0 auto;
      padding-left: max(var(--pad), env(safe-area-inset-left));
      padding-right:max(var(--pad), env(safe-area-inset-right));
      position:relative;
    }

    header{
      position:sticky; top:0; z-index:50;
      background: rgba(7,10,20,.62);
      backdrop-filter: blur(14px) saturate(140%);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .head{
      height:74px;
      display:flex; align-items:center; justify-content:space-between; gap:12px;
    }
    .brand{
      display:flex; align-items:center; gap:12px;
      padding:10px 12px;
      border-radius: 16px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
    }
    .brand img{height:34px; width:auto}

    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:10px;
      padding: 12px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      font-weight:850;
      cursor:pointer;
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
      white-space:nowrap;
    }
    .btn:hover{transform: translateY(-1px); border-color: rgba(122,162,255,.35); background: rgba(122,162,255,.10)}
    .btnPrimary{
      border-color: rgba(122,162,255,.40);
      background: linear-gradient(90deg, rgba(122,162,255,.22), rgba(125,227,255,.16));
    }

    .hero{
      position:relative;
      margin-top: 18px;
      border-radius: var(--radius);
      overflow:hidden;
      min-height: 320px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
    }
    .heroMedia{
      position:absolute; inset:0;
      background-position:center;
      background-size:cover;
      background-repeat:no-repeat;
      transform: scale(1.02);
    }
    .heroScrim{
      position:absolute; inset:0;
      background:
        radial-gradient(900px 520px at 18% 40%, rgba(7,10,20,.58), rgba(7,10,20,.90) 72%),
        linear-gradient(90deg, rgba(7,10,20,.92), rgba(7,10,20,.60) 55%, rgba(7,10,20,.30));
    }
    .heroInner{
      position:relative;
      padding: clamp(20px, 4vw, 34px);
      display:grid; gap:12px;
      max-width: 760px;
    }
    .kicker{
      color: rgba(125,227,255,.92);
      letter-spacing:.10em;
      text-transform:uppercase;
      font-weight:850;
      font-size:12px;
      display:inline-flex; align-items:center; gap:10px;
    }
    .kicker .dot{
      width:8px; height:8px; border-radius:99px;
      background: rgba(125,227,255,.8);
      box-shadow: 0 0 18px rgba(125,227,255,.35);
    }
    h1{
      margin:0;
      font-size: var(--h1);
      letter-spacing:-.03em;
      font-weight:950;
      line-height:1.15;
    }
    .sub{
      margin:0;
      color: var(--muted);
      font-size: var(--p);
      max-width: 70ch;
    }

    main{padding: 22px 0 70px}
    .grid{
      display:grid; gap:16px;
      grid-template-columns: 1fr;
      margin-top: 16px;
    }
    .card{
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: var(--radius);
      padding: 18px;
    }
    .card h2{
      margin:0 0 10px;
      font-size: var(--h2);
      letter-spacing:-.02em;
      font-weight:950;
    }
    .card p{margin:0 0 10px; color: var(--muted); font-size: var(--p)}
    .card p:last-child{margin-bottom:0}
    ul{margin: 10px 0 0; padding-left: 18px; color: var(--muted)}
    li{margin: 8px 0}

    .cta{
      display:flex; flex-wrap:wrap; gap:10px;
      margin-top: 12px;
    }

    footer{
      border-top: 1px solid rgba(255,255,255,.08);
      padding: 24px 0 28px;
      color: var(--muted);
    }

    [data-reveal]{opacity:0; transform: translateY(18px); transition: opacity .65s ease, transform .65s ease}
    [data-reveal].is-visible{opacity:1; transform:none}

    @media (min-width: 860px){
      .grid{grid-template-columns: 1.25fr .75fr; align-items:start}
    }
    @media (prefers-reduced-motion: reduce){
      html{scroll-behavior:auto}
      *{transition:none !important; animation:none !important}
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap head">
      <a class="brand" href="index.html#home" aria-label="Back to home">
        <img src="images/logo.jpg" alt="Fairfax Dentist logo" />
      </a>

      <div style="display:flex; gap:10px; align-items:center;">
        <a class="btn" href="index.html#services" aria-label="Back to services">
          <span aria-hidden="true">←</span> Back to Home
        </a>
        <a class="btn btnPrimary" href="index.html#contact" aria-label="Book on main page">
          Book
        </a>
      </div>
    </div>
  </header>

  <div class="wrap">
    <section class="hero" aria-label="Service hero" data-reveal>
      <div class="heroMedia" id="heroMedia"></div>
      <div class="heroScrim" aria-hidden="true"></div>
      <div class="heroInner">
        <div class="kicker"><span class="dot" aria-hidden="true"></span> Service Details</div>
        <h1 id="title">Service</h1>
        <p class="sub" id="subtitle">Professional care with modern technology and comfort-first approach.</p>

        <div class="cta">
          <a class="btn btnPrimary" href="tel:5715417977" aria-label="Call now">Call 571-541-7977</a>
          <a class="btn" href="index.html#contact" aria-label="Go to contact on main page">Contact</a>
        </div>
      </div>
    </section>

    <main>
      <div class="grid" data-reveal>
        <section class="card" aria-label="Overview">
          <h2>What you get</h2>
          <p id="overview"></p>

          <h2 style="margin-top:16px;">How it works</h2>
          <ul id="steps"></ul>
        </section>

        <aside class="card" aria-label="Highlights">
          <h2>Highlights</h2>
          <ul id="highlights"></ul>

          <h2 style="margin-top:16px;">Good to know</h2>
          <p id="note"></p>
        </aside>
      </div>
    </main>

    <footer>
      <div style="display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;">
        <small>© 2006-2026 Fairfax Dentist</small>
        <small>
          <a href="mailto:svvdmd@gmail.com">svvdmd@gmail.com</a> •
          <a href="tel:5715417977">571-541-7977</a>
        </small>
      </div>
    </footer>
  </div>

  <script>
    (function(){
      "use strict";

      const SERVICES = {
        implants: {
          title: "Dental Implants",
          subtitle: "Long-lasting, natural-looking replacement for missing teeth.",
          imgJpg: "images/implants.jpg",
          imgWebp: "images/implants.webp",
          overview: "Dental implants restore function and aesthetics by replacing the tooth root with a stable titanium post and a custom crown. Designed for durability, comfort, and a confident smile.",
          steps: [
            "Consultation & 3D planning",
            "Implant placement (comfort-first technique)",
            "Healing & integration phase",
            "Custom crown placement and bite refinement"
          ],
          highlights: [
            "Strong, stable, and natural-looking",
            "Helps preserve bone structure",
            "Improves chewing and speech",
            "Designed for long-term results"
          ],
          note: "Exact timing depends on bone health and case complexity. We’ll provide a clear plan and timeline after your evaluation."
        },
        veneers: {
          title: "Dental Veneers",
          subtitle: "Refine shape, color, and symmetry with custom porcelain veneers.",
          imgJpg: "images/veneers.jpg",
          imgWebp: "images/veneers.webp",
          overview: "Veneers are thin, custom-crafted shells that cover the front surface of teeth to enhance aesthetics while maintaining a natural appearance.",
          steps: [
            "Smile assessment and shade selection",
            "Conservative preparation",
            "Impressions / digital scan",
            "Veneer placement and polishing"
          ],
          highlights: [
            "Bright, consistent smile aesthetics",
            "Natural translucency and finish",
            "Custom-fit for comfort",
            "Stain-resistant porcelain options"
          ],
          note: "We aim for a conservative approach and a natural result — not an artificial look."
        },
        emergency: {
          title: "Emergency Dentist",
          subtitle: "Fast help for pain relief, trauma, and acute dental issues.",
          imgJpg: "images/dendist.jpg",
          imgWebp: "images/dendist.webp",
          overview: "Emergency care focuses on quick diagnosis and relief, then stabilization and a clear next-step plan to fully resolve the issue.",
          steps: [
            "Immediate assessment and diagnostics",
            "Pain control and infection management",
            "Stabilization or urgent procedure",
            "Follow-up plan for complete treatment"
          ],
          highlights: [
            "Same-day availability when possible",
            "Focus on relief and safety",
            "Clear explanation and plan",
            "Modern diagnostics for accuracy"
          ],
          note: "If you have swelling, fever, or severe pain, call immediately — we’ll prioritize urgent cases."
        },
        invisalign: {
          title: "Invisalign",
          subtitle: "Discreet orthodontic alignment with clear removable trays.",
          imgJpg: "images/invisalign.jpg",
          imgWebp: "images/invisalign.webp",
          overview: "Invisalign uses a series of clear aligners to gradually move teeth into position with minimal disruption to your daily life.",
          steps: [
            "Digital scan and treatment plan",
            "Aligner delivery and fitting",
            "Progress checks and refinements",
            "Retention to maintain results"
          ],
          highlights: [
            "Removable for meals and brushing",
            "Discreet appearance",
            "Predictable digital planning",
            "Comfort-focused adjustments"
          ],
          note: "Best results depend on consistent wear. We’ll guide your schedule and care."
        },
        whitening: {
          title: "Teeth Whitening",
          subtitle: "Professional whitening for a brighter, refreshed smile.",
          imgJpg: "images/teeth.jpg",
          imgWebp: "images/teeth.webp",
          overview: "Our whitening options target deep stains safely and effectively, helping restore a clean, bright look while keeping sensitivity minimal.",
          steps: [
            "Shade check and stain assessment",
            "Professional-grade whitening",
            "Sensitivity control recommendations",
            "Maintenance plan for longevity"
          ],
          highlights: [
            "Noticeable improvement in one visit",
            "Safe, controlled procedure",
            "Options for sensitive teeth",
            "Personalized maintenance tips"
          ],
          note: "Avoid staining foods for 24–48 hours post-treatment for best results."
        },
        rootcanal: {
          title: "Root Canal",
          subtitle: "Save infected teeth with precise endodontic therapy.",
          imgJpg: "images/canal.jpg",
          imgWebp: "images/canal.webp",
          overview: "Root canal treatment removes infected tissue, disinfects the canal, and seals the tooth to prevent reinfection — often preserving your natural tooth.",
          steps: [
            "Diagnostic imaging and anesthesia",
            "Cleaning and disinfection",
            "Filling and sealing",
            "Crown recommendation if needed"
          ],
          highlights: [
            "Relieves pain and prevents spread",
            "Preserves the natural tooth",
            "Modern techniques for comfort",
            "Strong long-term prognosis"
          ],
          note: "A crown may be recommended to protect the tooth after treatment."
        },
        aesthetic: {
          title: "Aesthetic Dentistry",
          subtitle: "Smile design combining restorative and cosmetic precision.",
          imgJpg: "images/aesthetic.jpg",
          imgWebp: "images/aesthetic.webp",
          overview: "Aesthetic dentistry blends artistry and clinical planning to improve balance, harmony, and confidence — from small refinements to full smile makeovers.",
          steps: [
            "Smile analysis and goal setting",
            "Mock-ups / previews when applicable",
            "Treatment execution (phased as needed)",
            "Finishing, polishing, and maintenance"
          ],
          highlights: [
            "Natural-looking results",
            "Personalized plan and pacing",
            "High-quality materials",
            "Confidence-focused approach"
          ],
          note: "We prioritize a premium, natural finish — not an overdone look."
        },
        xrays: {
          title: "Dental X-Rays",
          subtitle: "High-definition imaging for precise diagnosis and planning.",
          imgJpg: "images/xrays.jpg",
          imgWebp: "images/xrays.webp",
          overview: "Digital X-rays help detect issues early and plan treatment accurately — often before symptoms appear.",
          steps: [
            "Quick digital imaging",
            "Clinician review and findings",
            "Treatment plan discussion",
            "Follow-up imaging if required"
          ],
          highlights: [
            "Fast, low-dose imaging",
            "Early detection advantage",
            "Clear planning and transparency",
            "Essential for complex procedures"
          ],
          note: "Frequency depends on your dental history and risk factors."
        }
      };

      function getParam(name){
        const url = new URL(window.location.href);
        return url.searchParams.get(name);
      }

      // Reveal
      const revealEls = document.querySelectorAll("[data-reveal]");
      const io = new IntersectionObserver((entries) => {
        entries.forEach(en => {
          if(en.isIntersecting){
            en.target.classList.add("is-visible");
            io.unobserve(en.target);
          }
        });
      }, {threshold: 0.12});
      revealEls.forEach(el => io.observe(el));

      const key = (getParam("service") || "").toLowerCase();
      const data = SERVICES[key] || SERVICES.implants;

      document.title = data.title + " | Fairfax Dentist";
      document.getElementById("title").textContent = data.title;
      document.getElementById("subtitle").textContent = data.subtitle;
      document.getElementById("overview").textContent = data.overview;
      document.getElementById("note").textContent = data.note;

      const stepsEl = document.getElementById("steps");
      stepsEl.innerHTML = "";
      data.steps.forEach(s => {
        const li = document.createElement("li");
        li.textContent = s;
        stepsEl.appendChild(li);
      });

      const highlightsEl = document.getElementById("highlights");
      highlightsEl.innerHTML = "";
      data.highlights.forEach(s => {
        const li = document.createElement("li");
        li.textContent = s;
        highlightsEl.appendChild(li);
      });

      // hero media: prefer webp if possible
      const hero = document.getElementById("heroMedia");
      function canLoad(url){
        return new Promise((resolve) => {
          const im = new Image();
          im.onload = () => resolve(true);
          im.onerror = () => resolve(false);
          const sep = url.includes("?") ? "&" : "?";
          im.src = url + sep + "probe=" + Date.now();
        });
      }

      (async () => {
        const ok = await canLoad(data.imgWebp);
        const src = ok ? data.imgWebp : data.imgJpg;
        hero.style.backgroundImage = `url("${src}")`;
      })();

    })();
  </script>
</body>
</html>
